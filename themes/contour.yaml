# Contour: a Home Assistant theme in the style of a printed hiking map, light and dark mode in one theme.
# Community project, see the README for credits.
#
# The dashboard is a map sheet: fine brown contour lines and one river on a pale map green, cards as white map
# sheets with a thin forest-green rim, colours only from the map print (forest green, contour brown, water blue,
# road red, ink). Road red marks what is active. The dark mode is a night map of its own: light contour lines on deep
# forest green, not an inverted day map.
#
# Works without any add-on: colours, the contour background (an embedded SVG, nothing is downloaded), the sheet
# cards with their rim, road red for active devices, water blue for information, the narrow map font and the
# keyboard focus come from plain theme variables.
# Also without add-ons: map density (sheets close together, larger section titles), square tile sliders and a
# printed thermostat track.
# With card-mod 4.x installed (optional), the card-mod-* keys add a red map pin and a red state line on active
# device tiles, lower tile sliders like a scale bar (mouse only; touch keeps the full finger size), dashed trail lines between rows of entities cards, letter-spaced capitals for headings, badges and
# the sidebar, the narrow font in the sidebar, a framed selection there and a clear focus ring on badges. Without
# card-mod those keys are ignored.
#
# Fonts: narrow system fonts only (Avenir Next Condensed on Apple devices, Bahnschrift on Windows, the condensed
# system sans on Android, DejaVu or Liberation narrow cuts on Linux). Nothing is downloaded.
Contour:
  card-mod-theme: Contour

  # Theme-own variables, used below and by the card-mod rules
  contour-paper: "#edf1e2"
  contour-paper-low: "#e7ecdb"
  contour-sheet: "#fdfdf8"
  contour-rim: "#4b6b4a"
  contour-rule: "#c9d2bd"
  contour-ink: "#1e2a1f"
  contour-ink-soft: "#4e5b4b"
  contour-forest: "#366c39"
  contour-forest-pale: "#dfe9d6"
  contour-brown: "#94572e"
  contour-water: "#2563a8"
  contour-road: "#c4262b"
  contour-ochre: "#9a6212"
  contour-field: "#f1f4ea"
  contour-font: "'Avenir Next Condensed', 'Bahnschrift SemiCondensed', Bahnschrift, 'Roboto Condensed', sans-serif-condensed, 'Arial Narrow', 'Liberation Sans Narrow', 'DejaVu Sans Condensed', system-ui, sans-serif"
