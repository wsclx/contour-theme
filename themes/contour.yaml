  state-sensor-battery-low-color: "var(--contour-road)"
  state-sensor-battery-medium-color: "var(--contour-ochre)"
  state-sensor-battery-high-color: "var(--contour-forest)"
  state-vacuum-error-color: "var(--contour-road)"
  state-lawn_mower-active-color: "var(--contour-forest)"
  state-plant-active-color: "var(--contour-forest)"

  # Optional, card-mod 4.x: devices that are on, open, playing or detecting get a red map pin at their symbol and
  # their state line in road red, as a marked point with its label on a map. The domain list matters: the tile card
  # marks any entity with a value as active, sensors included. Coloured lights in road red instead of the bulb colour.
  # Rows of entities cards are separated by a dashed trail line; headings and card titles are letter-spaced capitals.
  card-mod-card: |
    ha-tile-icon { position: relative; }
    ha-card.active ha-tile-icon:is([data-domain=light], [data-domain=switch], [data-domain=fan], [data-domain=media_player], [data-domain=climate], [data-domain=input_boolean], [data-domain=humidifier], [data-domain=water_heater], [data-domain=vacuum], [data-domain=remote], [data-domain=siren], [data-domain=cover], [data-domain=valve], [data-domain=binary_sensor])::after {
      content: "";
      position: absolute;
      top: -1px;
      left: 0;
      width: 12px;
      height: 16px;
      background: var(--contour-pin) center / contain no-repeat;
      pointer-events: none;
    }
    @media (pointer: fine) { hui-card-features { --feature-height: 32px; } }
    ha-card.active:has(ha-tile-icon:is([data-domain=light], [data-domain=switch], [data-domain=fan], [data-domain=media_player], [data-domain=climate], [data-domain=input_boolean], [data-domain=humidifier], [data-domain=water_heater], [data-domain=vacuum], [data-domain=remote], [data-domain=siren], [data-domain=cover], [data-domain=valve], [data-domain=binary_sensor])) { --ha-tile-info-secondary-color: var(--contour-road); }
    ha-card.active:has(ha-tile-icon[data-domain=light]) { --tile-color: var(--state-light-active-color) !important; }
    :host(hui-entities-card) #states > div + div::after {
      content: "";
      position: absolute;
      inset: calc(var(--entities-card-row-gap) / -2 - .5px) 0 auto;
      height: 1px;
      background: repeating-linear-gradient(90deg, var(--contour-rule) 0 7px, transparent 7px 11px);
    }
    :host(hui-heading-card) .title .heading,
    .card-header {
      text-transform: uppercase;
      letter-spacing: .08em;
    }
  # Optional, card-mod 4.x: badges as map legend labels (capitals, letter-spaced) and a clear focus ring (the frontend
  # marks a focused badge only with a rim in the icon colour, which matches the green card rim)
  card-mod-badge: |
    ha-badge { display: inline-flex; text-transform: uppercase; letter-spacing: .06em; }
    ha-badge:focus-within { outline: 2px solid var(--ha-color-focus); outline-offset: 2px; border-radius: 6px; }
  # Optional, card-mod 4.x: the sidebar in the map face, capitals, a framed selection like a legend entry
  card-mod-sidebar: |
    :host { font-family: var(--contour-font); }
    ha-list-item-button { border-radius: 4px; text-transform: uppercase; letter-spacing: .06em; }
    ha-list-item-button.selected { box-shadow: inset 0 0 0 1px var(--contour-rim); }

