  ha-color-neutral-40: "#5c5f57"
  ha-color-neutral-50: "#787c73"
  ha-color-neutral-60: "#999d94"
  ha-color-neutral-70: "#b5b9af"
  ha-color-neutral-80: "#cfd3c9"
  ha-color-neutral-90: "#e6eae0"
  ha-color-neutral-95: "#f3f7ed"

  # The map: pale map green with the contour relief, fixed behind the content
  primary-background-color: "var(--contour-paper)"
  secondary-background-color: "var(--contour-paper-low)"
  lovelace-background: "var(--contour-relief) center / cover no-repeat fixed, var(--contour-paper)"

  # Map sheets: white, thin forest-green rim, square corners as on a cut sheet, no shadow (print is flat)
  card-background-color: "var(--contour-sheet)"
  ha-card-background: "var(--contour-sheet)"
  ha-card-border-color: "var(--contour-rim)"
  ha-card-border-width: "1px"
  ha-card-border-radius: "4px"
  ha-card-box-shadow: "none"
  ha-badge-border-radius: "4px"
  ha-tile-icon-border-radius: "4px"
  ha-card-features-border-radius: "3px"
  feature-border-radius: "3px"
  divider-color: "var(--contour-rule)"
  ha-heading-card-title-color: "var(--contour-ink)"
  ha-heading-card-subtitle-color: "var(--contour-ink-soft)"
  ha-heading-card-title-font-weight: "600"

  # Dialogs
  ha-dialog-border-radius: "6px"
  ha-dialog-surface-background: "var(--contour-sheet)"
  mdc-theme-surface: "var(--contour-sheet)"
  mdc-dialog-scrim-color: "rgba(20,32,25,.32)"
  paper-dialog-background-color: "var(--contour-sheet)"

  # Toolbar and sidebar: the map margin
  app-header-background-color: "var(--contour-paper)"
  app-header-text-color: "var(--contour-ink)"
  app-header-border-bottom: "1px solid var(--contour-rule)"
  sidebar-background-color: "#f4f6ee"
  sidebar-text-color: "var(--contour-ink)"
  sidebar-icon-color: "var(--contour-forest)"
  # The selected row is tinted with its own colour at 12 %; this green keeps 4.5:1 on that tint
  sidebar-selected-text-color: "#2c5a2f"
  sidebar-selected-icon-color: "#2c5a2f"
  sidebar-menu-button-text-color: "var(--contour-ink)"

  # Keyboard focus in forest green (the frontend default is grey)
  ha-color-focus: "var(--contour-forest)"

  # Switches: forest green track when on, white thumb
  ha-switch-checked-background-color: "var(--contour-forest)"
  ha-switch-checked-background-color-hover: "var(--contour-forest)"
  ha-switch-checked-border-color: "var(--contour-forest)"
  ha-switch-checked-border-color-hover: "var(--contour-forest)"
  ha-switch-checked-thumb-background-color: "var(--contour-sheet)"
  ha-switch-checked-thumb-background-color-hover: "var(--contour-sheet)"
  ha-switch-checked-thumb-border-color: "transparent"
  ha-switch-checked-thumb-border-color-hover: "transparent"
  ha-switch-background-color: "var(--contour-field)"
  ha-switch-background-color-hover: "var(--contour-field)"
  ha-switch-border-color: "var(--contour-ink-soft)"
  ha-switch-thumb-background-color: "var(--contour-ink-soft)"
  ha-switch-thumb-background-color-hover: "var(--contour-ink-soft)"
  switch-checked-button-color: "var(--contour-sheet)"
  switch-checked-track-color: "var(--contour-forest)"
  switch-unchecked-button-color: "var(--contour-ink-soft)"
  switch-unchecked-track-color: "var(--contour-field)"

  # Inputs and forms
  ha-color-form-background: "var(--contour-field)"
  ha-color-form-background-hover: "#e8ede0"
  input-fill-color: "var(--contour-field)"
  mdc-text-field-fill-color: "var(--contour-field)"
  mdc-select-fill-color: "var(--contour-field)"
  input-idle-line-color: "var(--contour-ink-soft)"
  input-hover-line-color: "var(--contour-forest)"
  input-outlined-idle-border-color: "var(--contour-ink-soft)"
  code-editor-background-color: "var(--contour-field)"
  markdown-code-background-color: "var(--contour-field)"

  # Sliders and gauges in water blue, charts in the map print colours
  slider-color: "var(--contour-water)"
  slider-track-color: "var(--contour-rule)"
  control-slider-color: "var(--contour-water)"
  info-color: "var(--contour-water)"
  graph-color-1: "var(--contour-forest)"
  graph-color-2: "var(--contour-water)"
  graph-color-3: "var(--contour-brown)"
  graph-color-4: "var(--contour-road)"
  graph-color-5: "var(--contour-ochre)"
  history-graph-line-color: "var(--contour-forest)"
  # Weather symbols as on a map legend: ochre sun, water-blue rain, pale clouds with a contour-brown back cloud
  weather-icon-sun-color: "#d08a1c"
  weather-icon-moon-color: "var(--contour-ochre)"
  weather-icon-rain-color: "var(--contour-water)"
  weather-icon-cloud-front-color: "#dfe6d6"
  weather-icon-cloud-back-color: "#a9b3a0"

  # Fonts: a narrow map face for everything
  ha-font-family-body: "var(--contour-font)"
  ha-font-family-heading: "var(--contour-font)"
  ha-font-family-code: "ui-monospace, Menlo, Consolas, monospace"
  code-font-family: "ui-monospace, Menlo, Consolas, monospace"
  ha-tile-info-primary-letter-spacing: ".02em"

  # Messages
  error-color: "var(--contour-road)"
  warning-color: "var(--contour-ochre)"
  success-color: "var(--contour-forest)"

  # Palette, strictly from the map print: every colour the frontend asks for maps to one of five inks
  red-color: "var(--contour-road)"
  pink-color: "var(--contour-road)"
  purple-color: "#3d4f8f"
  deep-purple-color: "#3d4f8f"
  indigo-color: "#3d4f8f"
  blue-color: "var(--contour-water)"
  light-blue-color: "#3f86c6"
  cyan-color: "#3f86c6"
  teal-color: "#2f7d74"
  green-color: "var(--contour-forest)"
  light-green-color: "#578958"
  lime-color: "#578958"
  yellow-color: "var(--contour-ochre)"
  amber-color: "var(--contour-ochre)"
  orange-color: "var(--contour-ochre)"
  deep-orange-color: "var(--contour-brown)"
  brown-color: "var(--contour-brown)"
  grey-color: "var(--contour-ink-soft)"
  state-icon-color: "var(--contour-ink)"
  state-inactive-color: "var(--contour-ink-soft)"
  # Active devices in road red, like a marked point on the map
  state-active-color: "var(--contour-road)"
  state-light-active-color: "var(--contour-road)"
  state-switch-active-color: "var(--contour-road)"
  state-input_boolean-active-color: "var(--contour-road)"
  state-fan-active-color: "var(--contour-road)"
  state-media_player-active-color: "var(--contour-road)"
  state-cover-active-color: "var(--contour-road)"
  state-vacuum-active-color: "var(--contour-road)"
  state-humidifier-active-color: "var(--contour-road)"
  state-climate-heat-color: "var(--contour-road)"
  state-climate-cool-color: "var(--contour-water)"
  state-climate-auto-color: "var(--contour-forest)"
  state-lock-locked-color: "var(--contour-forest)"
  state-lock-unlocked-color: "var(--contour-road)"

  # Optional, card-mod 4.x: a small red map pin on tiles of devices that are on, open, playing or detecting.
  # The domain list matters: the tile card marks any entity with a value as active, sensors included.
  # Coloured lights in road red instead of their bulb colour; dashed rules between rows of entities cards;
  # letter-spaced capitals for headings and card titles.
  card-mod-card: |
    ha-card.active ha-tile-icon:is([data-domain=light], [data-domain=switch], [data-domain=fan], [data-domain=media_player], [data-domain=climate], [data-domain=input_boolean], [data-domain=humidifier], [data-domain=water_heater], [data-domain=vacuum], [data-domain=remote], [data-domain=siren], [data-domain=cover], [data-domain=valve], [data-domain=binary_sensor]) { position: relative; }
    ha-card.active ha-tile-icon:is([data-domain=light], [data-domain=switch], [data-domain=fan], [data-domain=media_player], [data-domain=climate], [data-domain=input_boolean], [data-domain=humidifier], [data-domain=water_heater], [data-domain=vacuum], [data-domain=remote], [data-domain=siren], [data-domain=cover], [data-domain=valve], [data-domain=binary_sensor])::after {
      content: "";
      position: absolute;
      top: -1px;
      left: 0;
      width: 12px;
      height: 16px;
      background: var(--contour-pin) center / contain no-repeat;
      pointer-events: none;
    }
    ha-card.active:has(ha-tile-icon[data-domain=light]) { --tile-color: var(--state-light-active-color) !important; }
    :host(hui-entities-card) #states > div + div::before {
      content: "";
      position: absolute;
      top: calc(var(--entities-card-row-gap, 8px) / -2);
      left: 0;
      right: 0;
      border-top: 1px dashed var(--contour-rule);
    }
    :host(hui-heading-card) .title .heading,
    .card-header {
      text-transform: uppercase;
      letter-spacing: .08em;
    }
  # Optional, card-mod 4.x: badges of coloured lights in road red instead of the bulb colour; a clear focus ring
  # (the frontend marks a focused badge only with a rim in the icon colour, which matches the green card rim)
  card-mod-badge: |
    ha-badge { display: inline-flex; }
    ha-badge:focus-within { outline: 2px solid var(--ha-color-focus); outline-offset: 2px; border-radius: 6px; }
    ha-badge[style*="--badge-color:#"], ha-badge[style*="--badge-color:rgb"] { --badge-color: var(--state-light-active-color) !important; }
  # Optional, card-mod 4.x: the dashboard title in the map face
  card-mod-root: |
    .main-title { font-family: var(--contour-font); letter-spacing: .02em; }
  # Optional, card-mod 4.x: the sidebar in the map face, capitals, a framed selection like a legend entry
  card-mod-sidebar: |
    :host { font-family: var(--contour-font); }
    ha-list-item-button { border-radius: 4px; text-transform: uppercase; letter-spacing: .06em; }
    ha-list-item-button.selected { box-shadow: inset 0 0 0 1px var(--contour-rim); }

  modes:
    light: {}
    dark:
      # Night map: light contour lines on deep forest green
      contour-paper: "#142019"
      contour-paper-low: "#111b15"
      contour-sheet: "#1b2921"
