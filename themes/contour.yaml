  state-binary_sensor-moisture-on-color: "var(--contour-water)"
  state-valve-active-color: "var(--contour-water)"
  state-water_heater-eco-color: "var(--contour-forest)"
  # Secured and at home in forest green, pending in ochre, alarm in road red
  state-alarm_control_panel-armed_away-color: "var(--contour-forest)"
  state-alarm_control_panel-armed_home-color: "var(--contour-forest)"
  state-alarm_control_panel-armed_night-color: "var(--contour-forest)"
