  state-climate-auto-color: "var(--contour-forest)"
  state-lock-locked-color: "var(--contour-forest)"
  state-lock-unlocked-color: "var(--contour-road)"
  state-lock-open-color: "var(--contour-road)"
  state-lock-jammed-color: "var(--contour-road)"
  state-lock-locking-color: "var(--contour-ochre)"
  state-lock-unlocking-color: "var(--contour-ochre)"
