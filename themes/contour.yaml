  state-alarm_control_panel-pending-color: "var(--contour-ochre)"
  state-alarm_control_panel-triggered-color: "var(--contour-road)"
  state-person-home-color: "var(--contour-forest)"
  state-device_tracker-home-color: "var(--contour-forest)"
